name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

# A new push to a PR cancels the run still in progress for the previous commit
# (release-please pushes twice in a row: version bump, then the Cargo.lock sync).
# Runs on develop are never cancelled, so every merge keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # GPUI needs a graphics stack to build; Windows is the supported target.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          # Only develop writes the cache; PRs read it. Avoids one ~GB cache per PR branch.
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo test --workspace

  manifest-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: latest.json generator output matches the committed fixture
        run: |
          echo "ZmFrZS1zaWduYXR1cmU=" > /tmp/fake.sig
          touch /tmp/pr-dashboard_0.1.7_x64-setup.exe
          python scripts/make_latest_json.py \
            --version 0.1.7 --repo hebus/pr-dashboard \
            --installer /tmp/pr-dashboard_0.1.7_x64-setup.exe \
            --signature /tmp/fake.sig \
            --notes "Fixture" --pub-date 2026-11-11T10:00:00Z \
            --out /tmp/latest.json
          python - <<'EOF'
          import json
          generated = json.load(open("/tmp/latest.json"))
          fixture = json.load(open("crates/app/tests/fixtures/latest.json"))
          # Only the signature text differs between this run and the fixture.
          for d in (generated, fixture):
              for p in d["platforms"].values():
                  p["signature"] = "<sig>"
          assert generated == fixture, "regenerate crates/app/tests/fixtures/latest.json"
          print("fixture is up to date")
          EOF
